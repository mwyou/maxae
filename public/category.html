<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAXÆ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Space+Grotesk:wght@300;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color: #f4f4f5;
        background: #050505;
        font-family: 'Space Grotesk', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scrollbar-width: none;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 16% 18%, var(--accent-soft, rgb(168 85 247 / 0.16)), transparent 30rem),
          linear-gradient(180deg, #050505 0%, #0c0c0d 100%);
        color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      .site-header {
        position: fixed;
        z-index: 50;
        top: 0;
        left: 0;
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgb(255 255 255 / 0.08);
        padding: 24px 32px;
        background: rgb(11 11 11 / 0.48);
        backdrop-filter: blur(18px) saturate(1.25);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
      }

      .brand,
      .maxae-logo {
        display: block;
        width: 46px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .desktop-nav {
        display: flex;
        gap: 32px;
        color: #fff;
        font-size: 14px;
        font-weight: 300;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .desktop-nav a:hover,
      .desktop-nav .is-active {
        color: #facc15;
      }

      .language-toggle {
        min-width: 48px;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        padding: 4px 12px;
        color: #fff;
        background: rgb(24 24 27 / 0.5);
        backdrop-filter: blur(8px);
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0.18em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .category-hero {
        position: relative;
        display: grid;
        min-height: 100svh;
        align-items: end;
        padding: 132px clamp(24px, 6vw, 92px) clamp(42px, 7vw, 84px);
        overflow: hidden;
      }

      .hero-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(0.12) brightness(0.88) contrast(1.04);
        transform: scale(1.02);
      }

      .category-hero::after {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgb(5 5 5 / 0.78) 0%, rgb(5 5 5 / 0.36) 44%, rgb(5 5 5 / 0.08) 100%),
          linear-gradient(180deg, rgb(5 5 5 / 0.08), rgb(5 5 5 / 0.62));
        content: '';
      }

      .hero-content {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(240px, 360px);
        gap: clamp(36px, 7vw, 92px);
        align-items: end;
      }

      .category-kicker,
      .meta-label,
      .back-link {
        color: #a1a1aa;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.32em;
        line-height: 1.6;
        text-transform: uppercase;
      }

      h1 {
        max-width: 980px;
        margin: 18px 0 0;
        font-size: clamp(56px, 12vw, 154px);
        font-weight: 900;
        letter-spacing: -0.075em;
        line-height: 0.88;
        text-transform: uppercase;
      }

      .hero-summary {
        max-width: 560px;
        margin: 28px 0 0;
        color: #d4d4d8;
        font-family:
          'Noto Serif SC',
          'Songti SC',
          serif;
        font-size: clamp(17px, 2vw, 23px);
        letter-spacing: 0.06em;
        line-height: 2;
      }

      .meta-panel {
        border-left: 1px solid rgb(255 255 255 / 0.18);
        padding-left: 28px;
      }

      .meta-panel dl {
        display: grid;
        gap: 24px;
        margin: 0;
      }

      .meta-panel dt {
        margin-bottom: 6px;
      }

      .meta-panel dd {
        margin: 0;
        color: #f4f4f5;
        font-size: 15px;
        letter-spacing: 0.08em;
        line-height: 1.7;
      }

      .content-band {
        width: min(1280px, 100%);
        margin: 0 auto;
        padding: clamp(82px, 11vw, 150px) clamp(24px, 6vw, 92px);
      }

      .display-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-auto-rows: 92px;
        gap: 18px;
        margin-top: 58px;
      }

      .display-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 0.1);
        padding: 24px;
        background:
          linear-gradient(145deg, rgb(255 255 255 / 0.07), transparent 58%),
          #111113;
        background-position: center;
        background-size: cover;
      }

      .display-card::after {
        position: absolute;
        right: -20%;
        bottom: -20%;
        width: 68%;
        aspect-ratio: 1;
        border: 1px solid color-mix(in srgb, var(--accent, #facc15) 45%, transparent);
        content: '';
        opacity: 0.45;
        transform: rotate(12deg);
      }

      .display-card.has-image::before {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.72));
        content: '';
      }

      .display-card.has-image::after {
        opacity: 0.18;
      }

      .display-card:nth-child(1) {
        grid-column: span 4;
        grid-row: span 4;
      }

      .display-card:nth-child(2) {
        grid-column: span 2;
        grid-row: span 3;
      }

      .display-card:nth-child(3) {
        grid-column: span 2;
        grid-row: span 3;
      }

      .display-card:nth-child(4) {
        grid-column: span 3;
        grid-row: span 3;
      }

      .display-card:nth-child(5) {
        grid-column: span 3;
        grid-row: span 3;
      }

      .display-card:nth-child(6n) {
        grid-column: span 2;
        grid-row: span 3;
      }

      .display-card:nth-child(6n + 1):not(:first-child) {
        grid-column: span 3;
        grid-row: span 4;
      }

      .display-card span {
        position: relative;
        z-index: 1;
        color: #52525b;
        font-size: 12px;
        letter-spacing: 0.18em;
      }

      .display-card strong {
        position: relative;
        z-index: 1;
        display: block;
        color: #f4f4f5;
        font-size: clamp(20px, 3vw, 38px);
        letter-spacing: 0.08em;
        line-height: 1.5;
      }

      .display-card p {
        position: relative;
        z-index: 1;
        margin: 16px 0 0;
        color: #a1a1aa;
        font-size: 14px;
        letter-spacing: 0.08em;
        line-height: 1.8;
      }

      .display-card .artwork-meta {
        margin-top: 18px;
        color: #d4d4d8;
        font-size: 12px;
        letter-spacing: 0.12em;
        line-height: 1.8;
        text-transform: uppercase;
      }

      .display-card .artwork-description {
        max-width: 42rem;
        color: #e4e4e7;
        font-family:
          'Noto Serif SC',
          'Songti SC',
          serif;
        font-size: 14px;
        letter-spacing: 0.06em;
      }

      .display-card.has-image strong {
        text-shadow: 0 14px 36px rgb(0 0 0 / 0.62);
      }

      .display-card.has-image .artwork-meta,
      .display-card.has-image .artwork-description {
        color: #f4f4f5;
        text-shadow: 0 10px 26px rgb(0 0 0 / 0.72);
      }

      .back-link {
        display: inline-block;
        margin-top: 54px;
        color: #facc15;
      }

      @media (max-width: 860px) {
        .hero-content,
        .display-grid {
          grid-template-columns: 1fr;
        }

        .display-grid {
          grid-auto-rows: 88px;
        }

        .display-card:nth-child(n) {
          grid-column: auto;
          grid-row: span 3;
        }

        .meta-panel {
          border-left: 0;
          border-top: 1px solid rgb(255 255 255 / 0.18);
          padding-top: 24px;
          padding-left: 0;
        }

        .desktop-nav {
          display: none;
        }
      }
    </style>
  </head>

          back: '\u8fd4\u56de\u5c55\u89c8',
          meta: {
            mediumLabel: '\u5a92\u4ecb',
            focusLabel: '\u5173\u952e\u8bcd',
            viewLabel: '\u5c55\u89c8\u7ed3\u6784',
            view: '\u7b56\u5c55\u8bf4\u660e / \u4f5c\u54c1\u5899',
          },
          wall: [
            { title: '\u4f5c\u54c1 01' },
            { title: '\u4f5c\u54c1 02' },
            { title: '\u4f5c\u54c1 03' },
            { title: '\u4f5c\u54c1 04' },
            { title: '\u4f5c\u54c1 05' },
          ],
        },
        en: {
          nav: { exhibition: 'Exhibition', about: 'About' },
          kicker: 'Online Exhibition',
          back: 'Back to Exhibition',
          meta: {
            mediumLabel: 'Medium',
            focusLabel: 'Focus',
            viewLabel: 'View',
            view: 'Curatorial note / Work wall',
          },
          wall: [
            { title: 'Work 01' },
            { title: 'Work 02' },
            { title: 'Work 03' },
            { title: 'Work 04' },
            { title: 'Work 05' },
          ],
        },
      }

      const params = new URLSearchParams(window.location.search)
      const type = params.get('type') || 'chinese-painting'
      const data = categories[type] || categories['chinese-painting']
      let artworks = []
      const button = document.querySelector('.language-toggle')
      const languageKey = 'maxae-lang'
      let lang = localStorage.getItem(languageKey) === 'en' ? 'en' : 'zh'

      const getCopy = (path) => {
        if (path === 'title' || path === 'summary') return data[lang][path]
        if (path.startsWith('meta.')) {
          const key = path.split('.')[1]
          return data[lang][key] || common[lang].meta[key]
        }
        if (path.startsWith('wall.')) {
          const [, index, key] = path.split('.')
          const wall = common[lang].wall[Number(index)]
          return wall?.[key]
        }
        return path.split('.').reduce((value, key) => value?.[key], common[lang])
      }

      const escapeHtml = (value) =>
        String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;')

      const getArtworkTitle = (artwork) => {
        if (!artwork) return ''
        return lang === 'zh'
          ? artwork.title_zh || artwork.title_en || ''
          : artwork.title_en || artwork.title_zh || ''
      }

      const getArtworkDescription = (artwork) => {
        if (!artwork) return ''
        return lang === 'zh'
          ? artwork.description_zh || artwork.description_en || ''
          : artwork.description_en || artwork.description_zh || ''
      }

      const getArtworkMeta = (artwork) => {
        if (!artwork) return ''
        const artist = lang === 'zh'
          ? artwork.artist_zh || artwork.artist_en || ''
          : artwork.artist_en || artwork.artist_zh || ''
        const medium = lang === 'zh'
          ? artwork.medium_zh || artwork.medium_en || ''
          : artwork.medium_en || artwork.medium_zh || ''
        return [artist, artwork.year_text, medium].filter(Boolean).join(' / ')
      }

      const renderArtworkWall = () => {
        const items = artworks.length
          ? artworks
          : common[lang].wall.map((item) => ({ title_fallback: item.title }))

        document.querySelector('#artworkGrid').innerHTML = items
          .map((artwork, index) => {
            const title = getArtworkTitle(artwork) || artwork.title_fallback || getCopy(`wall.${index}.title`) || `Work ${index + 1}`
            const meta = getArtworkMeta(artwork)
            const description = getArtworkDescription(artwork)
            const image = artwork.image_url || ''

            return `
              <article
                class="display-card${image ? ' has-image' : ''}"
                ${image ? `style="background-image:url('${escapeHtml(image)}')"` : ''}
              >
                <span>${String(index + 1).padStart(2, '0')}</span>
                <div>
                  <strong>${escapeHtml(title)}</strong>
                  ${meta ? `<p class="artwork-meta">${escapeHtml(meta)}</p>` : ''}
                  ${description ? `<p class="artwork-description">${escapeHtml(description)}</p>` : ''}
                </div>
              </article>
            `
          })
          .join('')
      }

      const hydrateFromApi = async () => {
        try {
          const [categoryResponse, artworkResponse] = await Promise.all([
            fetch(`/api/public/categories/${type}`),
            fetch(`/api/public/categories/${type}/artworks`),
          ])

          if (!categoryResponse.ok || !artworkResponse.ok) return

          const category = await categoryResponse.json()
          artworks = await artworkResponse.json()

          data.image = category.cover_url || data.image
          data.accent = category.accent || data.accent
          data.zh = {
            ...data.zh,
            title: category.name_zh || data.zh.title,
            summary: category.summary_zh || data.zh.summary,
            medium: category.medium_zh || data.zh.medium,
            focus: category.focus_zh || data.zh.focus,
          }
          data.en = {
            ...data.en,
            title: category.name_en || data.en.title,
            summary: category.summary_en || data.en.summary,
            medium: category.medium_en || data.en.medium,
            focus: category.focus_en || data.en.focus,
          }
          render()
        } catch {
          render()
        }
      }

      const render = () => {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
        document.title = 'MAX\u00c6'
        localStorage.setItem(languageKey, lang)
        document.documentElement.style.setProperty('--accent', data.accent)
        document.documentElement.style.setProperty('--accent-soft', `${data.accent}24`)
        document.querySelector('.hero-image').src = data.image
        document.querySelector('.hero-image').alt = data[lang].title
        document.querySelectorAll('[data-i18n]').forEach((element) => {
          element.textContent = getCopy(element.dataset.i18n)
        })
        button.textContent = lang === 'zh' ? 'EN' : '\u4e2d\u6587'
        button.setAttribute(
          'aria-label',
          lang === 'zh' ? 'Switch to English' : '\u5207\u6362\u5230\u4e2d\u6587',
        )
        renderArtworkWall()
      }

      button.addEventListener('click', () => {
        lang = lang === 'zh' ? 'en' : 'zh'
        render()
      })

      render()
      hydrateFromApi()
    </script>
  </body>
</html>
