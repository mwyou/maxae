name = "maxae"
compatibility_date = "2026-05-17"
main = "worker/index.js"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "maxae"
database_id = "CLOUDFLARE_D1_DATABASE_ID_PLACEHOLDER"

[[kv_namespaces]]
binding = "KV"
id = "CLOUDFLARE_KV_NAMESPACE_ID_PLACEHOLDER"
